<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis de Pasos Diarios Estructurado</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="container my-5">
        <h1 class="text-center mb-5 text-primary">🚶‍♂️ Análisis Estadístico de Pasos Diarios (14 Días)</h1>

        <div class="card shadow-lg mb-5">
            <div class="card-header bg-primary text-white">Registro de Pasos</div>
            <div class="card-body">
                <form id="step-form" class="row g-3">
                    <div class="col-md-4">
                        <label for="participante" class="form-label">Participante</label>
                        <select id="participante" class="form-select" required>
                            <option value="">Seleccione</option>
                            <option value="P1">HUASCAR</option><option value="P2">XAVIER</option>
                            <option value="P3">ANTHONY</option><option value="P4">ALBERT</option>
                            <option value="P5">DAILENIS</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="dia" class="form-label">Día (1-14)</label>
                        <input type="number" id="dia" class="form-control" min="1" max="14" required>
                    </div>
                    <div class="col-md-4">
                        <label for="pasos" class="form-label">Pasos</label>
                        <input type="number" id="pasos" class="form-control" min="0" required>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-success">Registrar / Actualizar</button>
                    </div>
                </form>
                <div id="message" class="mt-3"></div>
            </div>
        </div>
        
        <div class="data-table-container mb-5">
            <h2 class="mb-3">Datos Brutos Registrados</h2>
            <div class="table-responsive">
                <table id="data-table" class="table table-bordered table-hover text-center align-middle"></table>
            </div>
        </div>
        
        <div class="stats-container">
            <h2 class="mb-4">📊 Análisis Estadístico</h2>
            
            <div class="row">
                <div class="col-lg-6 mb-4">
                    <div class="card h-100 shadow-sm">
                        <div class="card-header bg-info text-white">Estadísticas por Participante</div>
                        <div class="card-body p-0">
                            <table id="participant-stats-table" class="table table-striped table-sm mb-0">
                                <thead>
                                    <tr><th>P.</th><th>Media</th><th>Desv. Est.</th><th>Mín.</th><th>Máx.</th></tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="col-lg-6 mb-4">
                    <div class="card h-100 shadow-sm">
                        <div class="card-header bg-secondary text-white">Resumen Global</div>
                        <ul id="global-stats-list" class="list-group list-group-flush"></ul>
                    </div>
                </div>
            </div>
            
            <h3 class="mt-4 mb-3">Gráfico de Pasos Promedio Diarios</h3>
            <div class="card p-4 shadow-lg mb-5">
                <canvas id="dailyStepsChart"></canvas>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
